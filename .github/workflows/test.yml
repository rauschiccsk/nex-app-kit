name: Test

# Apps install nex-app-kit from a pinned tag, so a broken release reaches an app only when it bumps — and then in the
# middle of its build. Types, tests, the build and the demo build run here first.
# On the repository's own runner on ANDROS (ICC D-009: all CI runs on our own runners), started by
# Dedo's nastroje/ci_bezec.sh from the cockpit's runner template.

# Only what reaches main runs, and a run by hand: the repository is public and its runner stands on ANDROS — a pull
# request from somebody's fork must never run its code there.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: andros-ubuntu-nex-app-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The committed dist matches the source
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: The demo app builds from dist
        run: npm run demo:build
      - name: The version has its changelog entry
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## v${version}$" CHANGELOG.md || { echo "CHANGELOG.md has no section for v${version}"; exit 1; }

  server:
    runs-on: andros-ubuntu-nex-app-kit
    env:
      COMPOSE_PROJECT_NAME: kit-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Server — style, then the tests on Postgres
        run: |
          set -euo pipefail
          C="docker compose -f server/docker-compose.test.yml"
          $C build test
          $C run --rm test ruff check --no-cache src tests
          $C run --rm test ruff format --no-cache --check src tests
          $C run --rm test
      - name: Remove what the run left
        if: ${{ always() }}
        run: docker compose -f server/docker-compose.test.yml down -v --rmi local || true
