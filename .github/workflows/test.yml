name: Test

# Apps install nex-app-kit from a pinned tag, so a broken release reaches an app only when it bumps — and then in the
# middle of its build. Types, tests, the build and the demo build run here first.
# On the repository's own runner on ANDROS (ICC D-009: all CI runs on our own runners), started by
# Dedo's nastroje/ci_bezec.sh from the cockpit's runner template.

# Only what reaches main runs, and a run by hand: the repository is public and its runner stands on ANDROS — a pull
# request from somebody's fork must never run its code there.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: andros-ubuntu-nex-app-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The committed dist matches the source
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: The demo app builds from dist
        run: npm run demo:build
      - name: The version has its changelog entry
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## v${version}$" CHANGELOG.md || { echo "CHANGELOG.md has no section for v${version}"; exit 1; }

  server:
    runs-on: andros-ubuntu-nex-app-kit
    env:
      COMPOSE_PROJECT_NAME: kit-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Server — style, then the tests on Postgres
        run: |
          set -euo pipefail
          C="docker compose -f server/docker-compose.test.yml"
          $C build test
          $C run --rm test ruff check --no-cache src tests
          $C run --rm test ruff format --no-cache --check src tests
          $C run --rm test
      - name: Remove what the run left
        if: ${{ always() }}
        run: docker compose -f server/docker-compose.test.yml down -v --rmi local || true

  # What the cockpit writes into a new project on the template — filled with THIS commit of the kit, built and run as
  # the project's own CI and deploy would: frontend checks, images, the server's tests on Postgres, the whole stack up.
  scaffold:
    runs-on: andros-ubuntu-nex-app-kit
    needs: [test, server]
    strategy:
      max-parallel: 1
      matrix:
        auth: [password, manager]
    env:
      COMPOSE_PROJECT_NAME: scaffold-${{ matrix.auth }}-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH: ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The renderer's own tests and style
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app-$AUTH"
          python -m pip install pytest ruff
          python -m pytest scaffold/tests -q -p no:cacheprovider
          ruff check --no-cache --config server/pyproject.toml scaffold/render.py scaffold/tests
          ruff format --no-cache --check --config server/pyproject.toml scaffold/render.py scaffold/tests
      - name: Fill the scaffold as the cockpit does, with this commit of the kit
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app-$AUTH"
          cat > "$RUNNER_TEMP/values.json" <<JSON
          {"app_name": "NEX Skúška", "app_initials": "NS", "slug": "nex-skuska", "auth": "${{ matrix.auth }}", "ai": true,
           "backend_port": 18000, "frontend_port": 18001, "db_port": 18002,
           "kit_frontend": "github:rauschiccsk/nex-app-kit#${GITHUB_SHA}",
           "kit_server": "nex-app-kit @ https://github.com/rauschiccsk/nex-app-kit/archive/${GITHUB_SHA}.tar.gz#subdirectory=server"}
          JSON
          python scaffold/render.py nsv-standard --values "$RUNNER_TEMP/values.json" --out "$APP"
          # init.sh's part of a founded project: the first version's release notes.
          mkdir -p "$APP/docs/specs/versions/v0.1.0"
          echo "Prvá verzia." > "$APP/docs/specs/versions/v0.1.0/RELEASE_NOTES.md"
      - name: Frontend of the filled app — install, types, lint, tests, build
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app-$AUTH"
          cd "$APP/frontend"
          npm install --no-audit --no-fund
          npm run type-check
          npm run lint
          npx vitest run
          npm run build
      - name: Server of the filled app — style, images, tests on Postgres, the whole stack answers
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app-$AUTH"
          cd "$APP"
          docker compose build
          docker compose run --rm --no-deps --entrypoint "" test ruff check --no-cache .
          docker compose run --rm --no-deps --entrypoint "" test ruff format --no-cache --check .
          docker compose up -d db
          docker compose run --rm test
          docker compose up -d --wait backend frontend
          docker compose exec -T backend python -c "import json, urllib.request; h = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); print(h); assert h['checks']['database'] == 'ok'"
      - name: What the filled app's services said (only when the run failed)
        if: ${{ failure() }}
        run: |
          cd "$RUNNER_TEMP/app-$AUTH" 2>/dev/null && docker compose logs --no-color --tail 100 migrate backend frontend || true
      - name: Remove what the run left
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP/app-$AUTH" 2>/dev/null && docker compose down -v --rmi local || true
