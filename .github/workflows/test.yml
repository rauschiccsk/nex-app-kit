name: Test

# Apps install nex-app-kit from a pinned tag, so a broken release reaches an app only when it bumps — and then in the
# middle of its build. Types, tests, the build and the demo build run here first.
# On the repository's own runner on ANDROS (ICC D-009: private code never runs on GitHub's machines), started by
# Dedo's nastroje/ci_bezec.sh from the cockpit's runner template.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: andros-ubuntu-nex-app-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The committed dist matches the source
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: The demo app builds from dist
        run: npm run demo:build
      - name: The version has its changelog entry
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## v${version}$" CHANGELOG.md || { echo "CHANGELOG.md has no section for v${version}"; exit 1; }
