server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service on the compose network. Convention:
    # the backend service is named `backend` and listens on :8000 in-container
    # (FastAPI/uvicorn default — adjust the upstream port if your backend differs).
    # The same-origin api-client (baseUrl: "") sends `/api/...` here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Manifest a ikona sú v koreni a NEMAJÚ v názve odtlačok obsahu (ICCINT-83).
    #
    # Musia byť pred pravidlom nižšie, inak by ikonu pochytilo ono a odložilo ju na ROK — a zmenená
    # značka appky by sa k ľuďom rok nedostala. Zmerané: presne to sa dialo. Manifest zas padal do
    # poslednej vetvy bez akéhokoľvek pravidla a nginx ho podával ako `application/octet-stream`,
    # lebo príponu `.webmanifest` sám nepozná.
    #
    # `no-cache` NIE JE `no-store`: prehliadač si ich smie odložiť, ale musí sa vždy opýtať, či sa
    # nezmenili. Sú to malé súbory, takže tá otázka nič nestojí.
    location = /manifest.webmanifest {
        # Príponu `.webmanifest` nginx sám nepozná a podával by ju ako `application/octet-stream`.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /icon.svg {
        # Typ si nginx pozná sám; ide len o to, aby ju nepochytilo ročné pravidlo nižšie.
        add_header Cache-Control "no-cache" always;
    }

    # Zväzok z Vite má v názve odtlačok obsahu, takže sa nikdy nemení pod tým istým menom —
    # môže sa teda ukladať nadlho. (ICCINT-83)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ Úvodná stránka sa NEUKLADÁ NIKDY (ICCINT-83).
    #
    # Je to jediný súbor bez odtlačku v názve, a je to ten, ktorý hovorí, ktorý zväzok sa má načítať.
    # Keď si ho prehliadač odloží, appka po nasadení ďalej ukazuje starú verziu a používateľ sa jej
    # nemá ako zbaviť — pomáha až inkognito. Šablóna dovtedy nemala pre úvodnú stránku žiadne pravidlo,
    # takže si ju prehliadač odkladal podľa vlastného uváženia; zmerané 08.09.2026 na NEX Managerovi,
    # ktorý z tejto šablóny vzišiel: posielal iba ETag. NEX Studio má tieto hlavičky dávno — šablóna,
    # z ktorej sa rodia nové projekty, ich nemala.
    #
    # Platí to dvojnásobne, keď sa zapne inštalovateľná appka (PWA): service worker ukladanie do pamäte
    # prehliadača ešte zosilní, takže zle nastavená úvodná stránka vie podávať starú verziu aj dni.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}
