server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service on the compose network. Convention:
    # the backend service is named `backend` and listens on :8000 in-container
    # (FastAPI/uvicorn default — adjust the upstream port if your backend differs).
    # The same-origin api-client (baseUrl: "") sends `/api/...` here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ The manifest and the icon live in the root and have NO content hash in their names (ICCINT-83).
    #
    # They must stand before the rule below, or it would catch the icon and cache it for a YEAR — and a
    # changed brand of the app would not reach people for a year. Measured: exactly that happened. The
    # manifest in turn fell into the last block with no rule at all, and nginx served it as
    # `application/octet-stream`, because it does not know the `.webmanifest` extension by itself.
    #
    # `no-cache` IS NOT `no-store`: the browser may keep them, but must always ask whether they have
    # changed. They are small files, so the question costs nothing.
    location = /manifest.webmanifest {
        # nginx does not know the `.webmanifest` extension by itself and would serve it as `application/octet-stream`.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /icon.svg {
        # nginx knows the type by itself; the point is only that the one-year rule below does not catch it.
        add_header Cache-Control "no-cache" always;
    }

    # The Vite bundle has a content hash in its names, so it never changes under the same name —
    # it may therefore be cached for long. (ICCINT-83)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ The start page is NEVER cached (ICCINT-83).
    #
    # It is the only file without a hash in its name, and it is the one that says which bundle to load.
    # Once the browser keeps it, the app goes on showing the old version after a deploy and the user has
    # no way to get rid of it — only an incognito window helps. Until then the template had no rule for
    # the start page, so the browser cached it as it saw fit; measured 08.09.2026 on NEX Manager, which
    # came from this template: it sent only an ETag. NEX Studio has had these headers for long — the
    # template new projects are born from did not.
    #
    # It matters twice as much once the app is made installable (PWA): a service worker makes the
    # browser's caching even stronger, so a badly set start page can serve the old version for days.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}
