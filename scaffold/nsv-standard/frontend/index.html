<!doctype html>
<!-- Unified NEX design: dark by default (nex-shared html.dark tokens apply). -->
<html lang="sk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{APP_NAME}}</title>

    <!-- So that the app can be installed and opened in its own window like a program (ICCINT-83).
         The manifest is only a DESCRIPTION — it caches nothing in the browser and changes nothing in how
         the app behaves in the browser. The rest (a service worker and a check whether the server has a
         newer version) belongs to ICCINT-76 and is done only there; switching a service worker on before
         that check exists would mean the user could be shown an old version for days. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
