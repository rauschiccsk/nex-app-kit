# {{APP_NAME}} — on the ICC app template „NSV štandard“ (nex-app-kit). Services the cockpit expects: db, migrate
# (alembic upgrade head — the template's tables, then the app's), backend, frontend, test (CI, TEST_DATABASE_URL).
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  additional_contexts:
    frontend: ./frontend
    docs: ./docs

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+pg8000://{{DB_NAME}}:ci@db:5432/{{DB_NAME}}}
  PUBLIC_URL: ${PUBLIC_URL:-}
  APP_VERSION: ${APP_VERSION:-0.1.0}
{{BACKEND_AUTH_ENV}}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: {{DB_NAME}}
      POSTGRES_DB: {{DB_NAME}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ci}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:{{DB_PORT}}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{DB_NAME}} -d {{DB_NAME}}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "{{BACKEND_PORT}}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.0.0-dev}
    restart: unless-stopped
    ports:
      - "{{FRONTEND_PORT}}:80"
    depends_on:
      - backend

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
      additional_contexts:
        frontend: ./frontend
        docs: ./docs
    scale: 0
    environment:
      TEST_DATABASE_URL: postgresql+pg8000://{{DB_NAME}}:${DB_PASSWORD:-ci}@db:5432/{{DB_NAME}}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
